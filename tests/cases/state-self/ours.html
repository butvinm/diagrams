<!doctype html>
<meta charset="utf-8" />
<title>state-self</title>

<diagram class="stack">
  <div class="initial" id="start"></div>
  <div class="state" id="idle">Idle</div>
  <div class="state" id="active" style="margin: 10px 0">Active</div>
  <div class="final" id="end"></div>

  <arrow from="start" to="idle" anchor="bottom top"></arrow>
  <arrow from="idle" to="active" anchor="bottom top">open</arrow>
  <!-- Self-transition: leaves Active's right side and loops back to it. -->
  <arrow from="active" to="active" anchor="right:0.68 right:0.32" path="spline" curvature="1.7">tick</arrow>
  <arrow from="active" to="end" anchor="bottom top">close</arrow>
</diagram>
