<!doctype html>
<meta charset="utf-8" />
<title>sequence-numbered</title>

<diagram class="sequence" participants="alice,john" style="width: 680px">
  <lifeline col="alice">Alice</lifeline>
  <lifeline col="john">John</lifeline>

  <!-- 1. Alice to John -->
  <point id="m1a" col="alice" row="1"></point>
  <point id="m1b" col="john"  row="1"></point>
  <arrow from="m1a" to="m1b" head="triangle">Hello John,<br />how are you?</arrow>

  <!-- 2. Alice to John -->
  <point id="m2a" col="alice" row="2"></point>
  <point id="m2b" col="john"  row="2"></point>
  <arrow from="m2a" to="m2b" head="triangle">John,<br />can you hear me?</arrow>

  <!-- 3. John to Alice (return) -->
  <point id="m3a" col="john"  row="3"></point>
  <point id="m3b" col="alice" row="3"></point>
  <arrow from="m3a" to="m3b" head="triangle" line="dashed">Hi Alice,<br />I can hear you!</arrow>

  <!-- 4. John to Alice (return) -->
  <point id="m4a" col="john"  row="4"></point>
  <point id="m4b" col="alice" row="4"></point>
  <arrow from="m4a" to="m4b" head="triangle" line="dashed">I feel great!</arrow>
</diagram>
