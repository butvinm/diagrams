<!doctype html>
<meta charset="utf-8" />
<title>class-assoc</title>

<style>
  diagram.classes {
    display: block;
    width: max-content;
    padding: 28px 44px;
  }
  /* Namespace frames: nested labelled rectangles (Company > Project > Module). */
  .ns {
    position: relative;
    border: 1px solid var(--dg-box-border);
    border-radius: 4px;
    padding: 28px 18px 18px;
  }
  .ns > .ns-label {
    position: absolute;
    top: 7px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
  }
  .ns-inner {
    display: grid;
    grid-template-columns: repeat(2, auto);
    justify-items: center;
    align-items: start;
    gap: 56px 72px;
  }
</style>

<diagram class="classes">
  <div class="ns">
    <div class="ns-label">Company</div>
    <div class="ns">
      <div class="ns-label">Project</div>
      <div class="ns">
        <div class="ns-label">Module</div>
        <div class="ns-inner">
          <div class="class" id="admin" style="grid-column: 1 / -1; grid-row: 1">
            <div class="class-name">Admin</div>
            <div class="class-section">
              <div>+addUser(user: User)</div>
              <div>+removeUser(user: User)</div>
              <div>+generateReport()</div>
            </div>
          </div>

          <div class="class" id="user" style="grid-column: 1; grid-row: 2">
            <div class="class-name">User</div>
            <div class="class-section">
              <div>+login(username: String, password: String)</div>
              <div>+logout()</div>
            </div>
          </div>

          <div class="class" id="report" style="grid-column: 2; grid-row: 2">
            <div class="class-name">Report</div>
            <div class="class-section">
              <div>+generatePDF(reportData: List)</div>
              <div>+generateCSV(reportData: List)</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Associations: Admin manages User, Admin generates Report (open arrowheads). -->
  <arrow from="admin" to="user" anchor="bottom:0.3 top" head="open">manages</arrow>
  <arrow from="admin" to="report" anchor="bottom:0.7 top" head="open">generates</arrow>
</diagram>
