<!doctype html>
<meta charset="utf-8" />
<title>label-placement</title>

<style>
  /* A feature showcase, not a diagram type: each connector demonstrates a value
     of the label-anchor / label-pos attributes. */
  diagram.labels {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 52px;
    padding: 44px 64px;
    font-family: var(--dg-font);
  }
  .cap {
    font: 600 13px var(--dg-mono);
    color: #777;
    margin-bottom: 14px;
  }
  /* Group 1 + 3: stacked horizontal connectors. */
  .hrow {
    display: flex;
    align-items: center;
  }
  .hrow + .hrow {
    margin-top: 40px;
  }
  .gap {
    width: 240px;
  }
  /* Group 2: vertical connectors side by side. */
  .vgroup {
    display: flex;
    gap: 150px;
  }
  .vcol {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 118px;
  }
  .b {
    padding: 7px 15px;
    border: 1.5px solid var(--dg-box-border);
    border-radius: 6px;
    background: var(--dg-box-bg);
    font-weight: 600;
  }
</style>

<diagram class="labels">
  <!-- ===== label-anchor on a horizontal connector ===== -->
  <div>
    <div class="cap">label-anchor on a horizontal connector</div>
    <div class="hrow"><div class="b" id="ht_a">A</div><div class="gap"></div><div class="b" id="ht_b">B</div></div>
    <div class="hrow"><div class="b" id="hc_a">A</div><div class="gap"></div><div class="b" id="hc_b">B</div></div>
    <div class="hrow"><div class="b" id="hb_a">A</div><div class="gap"></div><div class="b" id="hb_b">B</div></div>
  </div>

  <!-- ===== label-anchor on a vertical connector ===== -->
  <div>
    <div class="cap">label-anchor on a vertical connector</div>
    <div class="vgroup">
      <div class="vcol"><div class="b" id="vl_a">A</div><div class="b" id="vl_b">B</div></div>
      <div class="vcol"><div class="b" id="vc_a">A</div><div class="b" id="vc_b">B</div></div>
      <div class="vcol"><div class="b" id="vr_a">A</div><div class="b" id="vr_b">B</div></div>
    </div>
  </div>

  <!-- ===== label-pos along a connector ===== -->
  <div>
    <div class="cap">label-pos along a connector (center is the default)</div>
    <div class="hrow"><div class="b" id="p_a">A</div><div class="gap"></div><div class="b" id="p_b">B</div></div>
  </div>

  <!-- horizontal: top / center / bottom -->
  <arrow from="ht_a" to="ht_b" anchor="right left" label-anchor="top">top</arrow>
  <arrow from="hc_a" to="hc_b" anchor="right left" label-anchor="center">center</arrow>
  <arrow from="hb_a" to="hb_b" anchor="right left" label-anchor="bottom">bottom</arrow>

  <!-- vertical: left / center / right -->
  <arrow from="vl_a" to="vl_b" anchor="bottom top" label-anchor="left">left</arrow>
  <arrow from="vc_a" to="vc_b" anchor="bottom top" label-anchor="center">center</arrow>
  <arrow from="vr_a" to="vr_b" anchor="bottom top" label-anchor="right">right</arrow>

  <!-- along the line: tail / center / head (three labels on one connector) -->
  <arrow from="p_a" to="p_b" anchor="right left" label-pos="tail">tail</arrow>
  <arrow from="p_a" to="p_b" anchor="right left" label-pos="center">center</arrow>
  <arrow from="p_a" to="p_b" anchor="right left" label-pos="head">head</arrow>
</diagram>
