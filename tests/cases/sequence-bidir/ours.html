<!doctype html>
<meta charset="utf-8" />
<title>sequence-bidir</title>

<diagram class="sequence" participants="alice,bob" style="width: 820px">
  <lifeline col="alice">Alice</lifeline>
  <lifeline col="bob">Bob</lifeline>

  <!-- 1. bidirectional -->
  <point id="m1a" col="alice" row="1"></point>
  <point id="m1b" col="bob"   row="1"></point>
  <arrow from="m1a" to="m1b" tail="open" head="open">Hello!</arrow>

  <!-- 2. bidirectional -->
  <point id="m2a" col="alice" row="2"></point>
  <point id="m2b" col="bob"   row="2"></point>
  <arrow from="m2a" to="m2b" tail="open" head="open">Wow, we said that at the same time!</arrow>

  <!-- 3. bidirectional, dashed -->
  <point id="m3a" col="alice" row="3"></point>
  <point id="m3b" col="bob"   row="3"></point>
  <arrow from="m3a" to="m3b" tail="open" head="open" line="dashed">Bidirectional Arrows are so cool</arrow>
</diagram>
