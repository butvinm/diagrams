<!doctype html>
<meta charset="utf-8" />
<title>class-members</title>

<style>
  diagram.classes {
    display: flex;
    justify-content: center;
    padding: 28px 48px;
  }
</style>

<diagram class="classes">
  <div class="class" id="person">
    <div class="class-name">Person</div>
    <div class="class-section">
      <div>+ID : Guid</div>
      <div>+FirstName : string</div>
      <div>+LastName : string</div>
      <div>-privateProperty : string</div>
      <div>#ProtectedProperty : string</div>
      <div>~InternalProperty : string</div>
      <div>~AnotherInternalProperty : List&lt;List&lt;string&gt;&gt;</div>
    </div>
  </div>
</diagram>
